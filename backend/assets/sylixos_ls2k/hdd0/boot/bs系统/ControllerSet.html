<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>操纵杆</title>
</head>

<body>
<form action="" method="get" enctype="multipart/form-data" name="form1">
  <p><strong>操纵杆</strong></p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form2">
  <input name="WithJQ" type="submit" id="WithJQID" value="带机枪"/>
  <input name="WithGD" type="submit" id="WithGDID" value="带光电"/>
  <input name="WithLD" type="submit" id="WithLDID" value="带榴弹"/>
  <input name="WithJZ" type="submit" id="WithJZID" value="带拒止"/>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form3">
  <p>
    <input name="Up" type="submit" id="UpID" value="上"/>
    <input name="Down" type="submit" id="DownID" value="下"/>
  </p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form4">
  &nbsp;&nbsp;
  <input name="Stop" type="submit" id="StopID" value="停"/>
&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<input name="DingWei" type="submit" id="DingWeiID" value="定位"/>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form5">
  <p>
    <input name="Left" type="submit" id="LeftID" value="左"/>
    <input name="right" type="submit" id="RightID" value="右"/>
  </p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form6">
  光电方位：
  <input name="GDFWTxt" type="text" id="GDFWTxtID" value="0" size="8">
  <input name="GDFWVTxt" type="text" id="GDFWVTxtID" value="0" size="8">
</form>
<form action="" method="get" enctype="multipart/form-data" name="form7">
  <p>机枪俯仰：
    <input name="JQFYTxt" type="text" id="JQFYTxtID" value="0" size="8">
    <input name="JQFYVTxt" type="text" id="JQFYVTxtID" value="0" size="8">
  </p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form8">
  榴弹俯仰：
  <input name="LDFYTxt" type="text" id="LDFYTxtID" value="0" size="8">
  <input name="LDFYVTxt" type="text" id="LDFYVTxtID" value="0" size="8">
</form>
</body>
</html>
