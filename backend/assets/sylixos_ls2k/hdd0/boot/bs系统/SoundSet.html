<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>强声</title>
</head>

<body>
<form action="" method="get" enctype="multipart/form-data" name="form1">
  <p><strong>强声</strong></p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form2">
  <input name="SoundOpen" type="submit" id="SoundOpenID" value="开启"/>
  <input name="SoundClose" type="submit" id="SoundCloseID" value="关闭"/>
  <input name="SoundOpenFB" type="text" id="SoundOpenFBID" size="8" value="0">
</form>
<form action="" method="get" enctype="multipart/form-data" name="form3">
  <p>
    <input name="SoundInner" type="submit" id="SoundInnerID" value="内部音频"/>
    <input name="SoundHanHua" type="submit" id="SoundHanHuaID" value="喊话"/>
    <input name="SoundModeFB" type="text" id="SoundModeFBID" size="8" value="0">
  </p>
</form>
<form action="" method="get" enctype="multipart/form-data" name="form4">
  <input name="SoundVolume" type="submit" id="SoundVolumeID" value="音量"/>
  <input name="SoundVolumeTxt" type="text" id="SoundVolumeTxtID" value="1" size="8">
  <input name="SoundVolumeTxtFB" type="text" id="SoundVolumeTxtFBID" size="8" value="0">
</form>
<form action="" method="get" enctype="multipart/form-data" name="form5">
  <p>
    <input name="SoundNum" type="submit" id="SoundNumID" value="音频序号"/>
    <input name="SoundNumTxt" type="text" id="SoundNumTxtID" value="1" size="8">
    <input name="SoundNumTxtFB" type="text" id="SoundNumTxtFBID" size="8" value="0">
  </p>
</form>
</body>
</html>
